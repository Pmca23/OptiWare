# Gateway: UM endereço estável por serviço (8000 interface web, 8080 central, 9001 wh1, 9002 wh2).
# O cliente nunca muda de porta: se uma instância de backend cai, o nginx passa os pedidos para a outra.
#
# Redundância da própria entrada: este ficheiro é incluído por DOIS nginx (gateway-a.conf e gateway-b.conf) que
# partilham o mesmo endereço de rede (como um "pod"). Com `reuseport` o kernel reparte as ligações novas pelos dois;
# se um nginx cai, o outro continua a receber tudo no mesmo endereço, sem o cliente fazer nada.
#
# O nome de cada nginx ($gateway_name) é definido em gateway-a.conf / gateway-b.conf. Não se usa $hostname porque,
# com `network_mode: service:gateway`, os dois contentores herdam o MESMO hostname (o do contentor `gateway`).

include /etc/nginx/mime.types;
default_type application/octet-stream;

# IPs fixos (docker-compose): o nginx arranca e continua mesmo com uma instância parada/reiniciada
upstream central { server 172.28.0.11:3000 max_fails=1 fail_timeout=3s; server 172.28.0.12:3000 max_fails=1 fail_timeout=3s; }
upstream wh1     { server 172.28.0.21:3000 max_fails=1 fail_timeout=3s; server 172.28.0.22:3000 max_fails=1 fail_timeout=3s; }
upstream wh2     { server 172.28.0.31:3000 max_fails=1 fail_timeout=3s; server 172.28.0.32:3000 max_fails=1 fail_timeout=3s; }

# Instâncias individuais: usadas APENAS pelo painel de infraestrutura da interface (/node/<nome>/stats),
# para mostrar o estado de cada instância sem passar pelo balanceamento. Manter igual aos upstreams acima.
map $node $node_addr {
  default      "";
  central-api1 172.28.0.11:3000;
  central-api2 172.28.0.12:3000;
  wh1-api-a    172.28.0.21:3000;
  wh1-api-b    172.28.0.22:3000;
  wh2-api-a    172.28.0.31:3000;
  wh2-api-b    172.28.0.32:3000;
}

# configuração comum de failover (os POST são seguros de repetir: têm id idempotente)
proxy_connect_timeout 1s;
proxy_read_timeout 25s;
proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
proxy_next_upstream_tries 2;

server { listen 8080 reuseport; add_header X-Gateway $gateway_name always; location / { proxy_pass http://central; } }
server { listen 9001 reuseport; add_header X-Gateway $gateway_name always; location / { proxy_pass http://wh1; } }
server { listen 9002 reuseport; add_header X-Gateway $gateway_name always; location / { proxy_pass http://wh2; } }

# Interface web (http://localhost:8000): os ficheiros estáticos são servidos pelos DOIS nginx (cliente redundante)
# e as chamadas às APIs passam pelos mesmos upstreams, na mesma origem (sem CORS).
server {
  listen 8000 reuseport;
  keepalive_timeout 0;                     # cada pedido abre uma ligação nova -> o kernel reparte-os pelos dois nginx
  root /usr/share/nginx/html;

  location / {
    add_header X-Gateway $gateway_name always;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }
  location /fonts/ { add_header X-Gateway $gateway_name always; add_header Cache-Control "public, max-age=86400"; }

  location /api/central/ { add_header X-Gateway $gateway_name always; proxy_pass http://central/; }
  location /api/wh1/     { add_header X-Gateway $gateway_name always; proxy_pass http://wh1/; }
  location /api/wh2/     { add_header X-Gateway $gateway_name always; proxy_pass http://wh2/; }

  # topologia mostrada no painel de infraestrutura (manter igual ao `map $node` acima)
  location = /topology.json {
    add_header X-Gateway $gateway_name always;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 200 '{"gateways":["gateway-a","gateway-b"],"services":{"central":["central-api1","central-api2"],"wh1":["wh1-api-a","wh1-api-b"],"wh2":["wh2-api-a","wh2-api-b"]}}';
  }
  location ~ ^/node/(?<node>[a-z0-9-]+)/stats$ {
    add_header X-Gateway $gateway_name always;
    if ($node_addr = "") { return 404; }
    proxy_connect_timeout 1s;
    proxy_read_timeout 4s;
    proxy_next_upstream off;
    proxy_pass http://$node_addr/stats;
  }
}
